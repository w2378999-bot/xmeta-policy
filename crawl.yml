name: Monthly Policy Crawl

on:
  schedule:
    - cron: '0 1 1 * *'   # 每月1日 北京时间09:00（UTC+8 → UTC 01:00）
  workflow_dispatch:        # 支持手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # 允许 commit + push data.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run crawler
        env:
          DIFY_API_KEY:   ${{ secrets.DIFY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          LLM_API_KEY:    ${{ secrets.LLM_API_KEY }}
        run: python crawler.py

      - name: Commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "data.json unchanged, skip commit" || \
            git commit -m "chore: update data.json $(date '+%Y-%m-%d')"
          git push
